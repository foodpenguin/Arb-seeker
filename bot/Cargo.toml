[package]
name = "arbitrage-framework"
version = "0.1.0"
edition = "2024"
description = "Atomic on-chain arbitrage framework: strategy driver, flash-loan and flash-accounting funding, Aero merger arbitrage on Base as the example"
license = "AGPL-3.0-or-later"
repository = "https://github.com/foodpenguin/Arb-seeker"
publish = false

[lib]
name = "arbitrage_framework"
path = "src/lib.rs"

[[bin]]
name = "arb-bot"
path = "src/main.rs"

[dependencies]
onchain-core = { git = "https://github.com/foodpenguin/bot-onchain-core", tag = "v0.1.0" }
alloy = { version = "2.5.0", features = ["full", "json-rpc", "signer-local", "signer-keystore", "node-bindings"] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
